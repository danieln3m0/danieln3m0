# Prensa el herbario del perfil: genera los SVG a partir de los repos reales
# y los publica en la rama `output`, que el README enlaza.
name: Herbario

on:
  schedule:
    # Cada 12 horas, fuera de la hora en punto (GitHub retrasa esos turnos).
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "herbario/**"
      - ".github/workflows/herbario.yml"

permissions:
  contents: write

concurrency:
  group: herbario
  cancel-in-progress: true

jobs:
  prensar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: herbario/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: herbario

      - name: Prensar
        run: npm run build
        working-directory: herbario
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Un commit huérfano por ejecución: la rama no acumula historia de imágenes.
      - name: Publicar en la rama output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prensado del $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
