# Pliega el concepto origami: genera los SVG desde los repos reales y los
# publica en la rama `output-origami`, que enlaza el README de la rama origami.
name: Origami

on:
  workflow_dispatch:
  push:
    branches: [origami]
    paths:
      - "origami/**"
      - "herbario/lib/**"
      - "herbario/config.mjs"
      - ".github/workflows/origami.yml"

permissions:
  contents: write

concurrency:
  group: origami
  cancel-in-progress: true

jobs:
  plegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: herbario/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: herbario

      - name: Plegar
        run: node origami/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los valores de las estadísticas viven también en el README (alt y tabla).
      # Un push con GITHUB_TOKEN no vuelve a disparar el workflow.
      - name: Actualizar los datos del README
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Actualizar los datos de las estadísticas" README.md
            git push -q
          fi

      # Un commit huérfano por ejecución: la rama no acumula historia de imágenes.
      - name: Publicar en la rama output-origami
        working-directory: dist-origami
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output-origami
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Plegado del $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output-origami
