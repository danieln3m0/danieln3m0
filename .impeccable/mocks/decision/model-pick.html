<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cartel chicha</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#0d1117;width:1440px;height:900px;overflow:hidden;font-family:system-ui,sans-serif}
  .top{height:64px;border-bottom:1px solid #30363d}
  .wrap{display:grid;grid-template-columns:296px 1fr;gap:32px;padding:32px 80px}
  .avatar{width:296px;height:296px;border-radius:50%;background:#21262d}
  .readme{border:1px solid #30363d;border-radius:6px;padding:24px}
  .poster{background:#050505;height:560px;padding:26px 30px;display:flex;flex-direction:column;gap:10px}
  .strip{font:900 26px/1 Impact,"Arial Black",sans-serif;letter-spacing:.04em;color:#050505;background:#ffe600;padding:8px 14px;align-self:flex-start}
  .big{font:900 150px/.86 Impact,"Arial Black",sans-serif;letter-spacing:-.01em;-webkit-background-clip:text;background-clip:text;color:transparent}
  .a{background-image:linear-gradient(180deg,#ff2d95 0 34%,#ff7a00 34% 67%,#ffe600 67%)}
  .b{background-image:linear-gradient(180deg,#00d26a 0 34%,#00b8ff 34% 67%,#ff2d95 67%)}
  .row{display:flex;gap:10px;margin-top:auto}
  .row span{font:900 30px/1 Impact,"Arial Black",sans-serif;padding:10px 16px;color:#050505}
</style></head><body>
<div class="top"></div>
<div class="wrap"><div><div class="avatar"></div></div>
<div class="readme"><div class="poster">
  <div class="strip">¡EN VIVO DESDE LIMA!</div>
  <div class="big a">FRANCIS</div><div class="big b">DANIEL</div>
  <div class="strip" style="background:#00d26a">FULL-STACK · FRONT-END · CREATIVE CODING</div>
  <div class="row"><span style="background:#ff2d95">ORATORIA</span><span style="background:#ffe600">AYNI</span><span style="background:#00b8ff">KEYREU</span><span style="background:#ff7a00">PORTAFOLIO</span></div>
</div></div></div>
</body></html>
