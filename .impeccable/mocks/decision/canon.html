<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estándar de la categoría</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{background:#0d1117;width:1440px;height:900px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#e6edf3}
  .top{height:64px;border-bottom:1px solid #30363d}
  .wrap{display:grid;grid-template-columns:296px 1fr;gap:32px;padding:32px 80px}
  .avatar{width:296px;height:296px;border-radius:50%;background:#21262d}
  .readme{border:1px solid #30363d;border-radius:6px;padding:32px;text-align:center}
  h1{font-size:40px;font-weight:600}
  .sub{font-size:24px;color:#8b949e;margin-top:10px}
  .badges{display:flex;justify-content:center;gap:8px;margin-top:20px}
  .badges i{width:110px;height:28px;border-radius:4px;background:#2f81f7;display:block}
  .cards{display:flex;gap:16px;justify-content:center;margin-top:28px}
  .cards div{width:390px;height:170px;border:1px solid #30363d;border-radius:6px;background:#161b22}
  table{margin:28px auto 0;border-collapse:collapse;width:90%}
  td{border:1px solid #30363d;height:44px}
</style></head><body>
<div class="top"></div>
<div class="wrap"><div><div class="avatar"></div></div>
<div class="readme">
  <h1>Hola, soy Francis Daniel</h1>
  <div class="sub">Desarrollador full-stack · Lima, Perú</div>
  <div class="badges"><i></i><i style="background:#238636"></i><i style="background:#8957e5"></i><i style="background:#db6d28"></i></div>
  <div class="cards"><div></div><div></div></div>
  <table><tr><td></td><td></td></tr><tr><td></td><td></td></tr></table>
</div></div>
</body></html>
