<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Herbario de repositorios</title>
<style>
  :root{--gh:#0d1117;--line:#30363d;--muted:#8b949e;--sheet:#eef0ea;--ink:#16291f;--red:#b8231c;--tab:#9c1d17}
  *{box-sizing:border-box;margin:0}
  body{background:var(--gh);font-family:"Segoe UI",system-ui,sans-serif;color:#e6edf3;width:1440px;height:900px;overflow:hidden}
  .top{height:64px;border-bottom:1px solid var(--line)}
  .wrap{display:grid;grid-template-columns:296px 1fr;gap:32px;padding:32px 80px}
  .avatar{width:296px;height:296px;border-radius:50%;background:#21262d}
  .side p{height:12px;background:#21262d;border-radius:3px;margin-top:14px}
  .readme{border:1px solid var(--line);border-radius:6px;padding:24px}
  .folder{position:relative;background:var(--red);border-radius:4px;height:470px;padding:44px 40px 0}
  .tab{position:absolute;top:-1px;left:28px;background:var(--tab);color:#f6d9d4;font:700 22px/1 "Arial Narrow",Arial,sans-serif;letter-spacing:.08em;padding:12px 18px;border-radius:0 0 4px 4px}
  .sheet{position:relative;background:var(--sheet);height:100%;border-radius:2px 2px 0 0;box-shadow:0 -1px 0 rgba(0,0,0,.2)}
  svg.plant{position:absolute;left:30px;top:16px}
  .label{position:absolute;right:26px;bottom:26px;width:400px;border:2px solid var(--ink);padding:14px 16px;color:var(--ink);background:var(--sheet)}
  .label .inst{font:700 13px/1 Arial,sans-serif;letter-spacing:.18em}
  .label h1{font:800 40px/1 "Arial Narrow",Arial,sans-serif;letter-spacing:-.01em;text-transform:uppercase;margin:10px 0 8px}
  .label .bin{font:italic 24px/1.1 Georgia,serif}
  .label .typed{font:14px/1.5 "Courier New",monospace;margin-top:8px}
  .stamp{position:absolute;left:330px;bottom:40px;width:150px;height:150px;border:4px solid var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;text-align:center;font:800 22px/1 "Arial Narrow",Arial,sans-serif;transform:rotate(-12deg);opacity:.92}
  .barcode{position:absolute;right:26px;top:22px;width:150px;height:44px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 7px,transparent 7px 9px)}
  .md{margin-top:22px}
  .md p{height:12px;background:#30363d;border-radius:3px;margin-top:12px;width:78%}
  .tags{display:flex;gap:10px;margin-top:18px}
  .tags span{border:2px solid #e6edf3;padding:8px 14px;font:700 22px/1 "Arial Narrow",Arial,sans-serif;letter-spacing:.06em}
</style></head><body>
<div class="top"></div>
<div class="wrap">
  <div class="side"><div class="avatar"></div><p style="width:70%"></p><p style="width:45%"></p></div>
  <div class="readme">
    <div class="folder">
      <div class="tab">TIPOS · DANIELN3M0</div>
      <div class="sheet">
        <svg class="plant" width="330" height="410" viewBox="0 0 330 410" fill="none" stroke="#16291f" stroke-width="2" stroke-linecap="round">
          <path d="M165 405 C160 330 172 260 160 190 C150 130 168 80 162 20"/>
          <path d="M162 300 C120 280 90 250 60 210"/><path d="M164 250 C210 230 240 200 270 150"/>
          <path d="M160 190 C120 170 100 140 80 100"/><path d="M161 140 C200 120 225 95 240 60"/>
          <path d="M60 210 l-22 -6 M75 228 l-26 4 M90 248 l-20 14"/><path d="M270 150 l24 -8 M255 175 l26 2 M240 196 l18 16"/>
          <g fill="#16291f" stroke="none">
            <ellipse cx="44" cy="200" rx="12" ry="5" transform="rotate(-20 44 200)"/><ellipse cx="48" cy="236" rx="13" ry="5" transform="rotate(10 48 236)"/>
            <ellipse cx="66" cy="268" rx="12" ry="5" transform="rotate(40 66 268)"/><ellipse cx="296" cy="140" rx="13" ry="5" transform="rotate(-15 296 140)"/>
            <ellipse cx="284" cy="178" rx="13" ry="5" transform="rotate(5 284 178)"/><ellipse cx="262" cy="216" rx="12" ry="5" transform="rotate(40 262 216)"/>
            <ellipse cx="74" cy="94" rx="12" ry="5" transform="rotate(-50 74 94)"/><ellipse cx="244" cy="52" rx="12" ry="5" transform="rotate(-60 244 52)"/>
            <ellipse cx="162" cy="16" rx="5" ry="12"/><circle cx="120" cy="175" r="4"/><circle cx="210" cy="232" r="4"/>
          </g>
          <path d="M150 405 l-30 0 M180 405 l30 0" stroke-width="1"/>
          <rect x="140" y="320" width="50" height="10" fill="#e9e4d6" stroke="none" transform="rotate(-8 165 325)"/>
        </svg>
        <div class="barcode"></div>
        <div class="stamp">2.º PUESTO<br>GEMMA<br>2026</div>
        <div class="label">
          <div class="inst">HERBARIO DE REPOSITORIOS · LIMA, PERÚ</div>
          <h1>Francis Daniel<br>Mamani Silva</h1>
          <div class="bin">Fullstackia limensis</div>
          <div class="typed">Leg. danieln3m0 · Ingeniería de Software, UPC<br>Full-stack · Front-end · Creative coding</div>
        </div>
      </div>
    </div>
    <div class="md"><p></p><p style="width:62%"></p>
      <div class="tags"><span>PORTAFOLIO ↗</span><span>LINKEDIN</span><span>CORREO</span><span>INSTAGRAM</span></div>
    </div>
  </div>
</div>
</body></html>
